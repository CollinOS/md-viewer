<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Viewer</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <header class="tabbar">
        <div class="tabs" role="tablist"></div>
        <div class="tabbar-actions">
          <button class="icon-btn" data-action="edit" title="Edit (Ctrl+E)" aria-pressed="false" disabled>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10.5 2.5l3 3L6 13H3v-3l7.5-7.5z"/></svg>
          </button>
          <button class="icon-btn" data-action="open" title="Open file (Ctrl+O)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.75 3.5h4l1.5 1.5h7v7.75H1.75z"/></svg>
          </button>
          <button class="icon-btn" data-action="settings" title="Settings (Ctrl+,)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.25"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
          </button>
        </div>
      </header>
      <main class="workspace">
        <div class="editor-pane" hidden></div>
        <div class="divider" hidden></div>
        <div class="preview-pane" tabindex="-1">
          <div class="doc-host"></div>
          <div class="empty-state" hidden>
            <h1>No file open</h1>
            <p>Drop a markdown file here, or</p>
            <button class="primary-btn" data-action="open">Open a file</button>
            <div class="keys">
              <kbd>Ctrl+O</kbd><span>Open</span>
              <kbd>Ctrl+E</kbd><span>Toggle editing</span>
              <kbd>Ctrl+Tab</kbd><span>Next tab</span>
              <kbd>Ctrl+Shift+N</kbd><span>New window</span>
              <kbd>Ctrl+,</kbd><span>Settings</span>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div class="toasts"></div>
  </body>
</html>
